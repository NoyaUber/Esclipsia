<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0a0b" />
  <meta name="description" content="Eclipsia: Shattered World — a dark fantasy monster-collection RPG." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Eclipsia: Shattered World</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/menus.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <main id="game-root">
    <canvas id="game-canvas" width="320" height="180" aria-label="Eclipsia game screen"></canvas>
  </main>

  <!-- On-screen touch controls (shown automatically on touch devices) -->
  <div id="touch-controls" aria-hidden="true">
    <div id="dpad" class="dpad">
      <span class="dpad-arm dpad-up"></span>
      <span class="dpad-arm dpad-down"></span>
      <span class="dpad-arm dpad-left"></span>
      <span class="dpad-arm dpad-right"></span>
      <span class="dpad-center"></span>
    </div>
    <div class="action-buttons">
      <button type="button" class="touch-btn btn-b" data-action="cancel">B</button>
      <button type="button" class="touch-btn btn-a" data-action="confirm">A</button>
    </div>
    <div class="system-buttons">
      <button type="button" class="touch-btn btn-system" id="btn-fullscreen">FULL</button>
      <button type="button" class="touch-btn btn-system" data-action="menu">MENU</button>
    </div>
  </div>

  <div id="rotate-hint" role="status">
    <div class="rotate-icon"></div>
    <p>Rotate your device to landscape</p>
    <small>The game is paused and will resume when you rotate back.</small>
  </div>

  <div id="boot-screen" role="status">
    <div class="boot-title">ECLIPSIA</div>
    <div class="boot-bar"><div id="boot-progress"></div></div>
    <p id="boot-text">Awakening the Aether…</p>
  </div>

  <div id="error-screen" role="alert" hidden>
    <h1>Something broke the Aether</h1>
    <pre id="error-message"></pre>
    <button type="button" id="error-reload">Reload</button>
  </div>

  <noscript>Eclipsia requires JavaScript to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
